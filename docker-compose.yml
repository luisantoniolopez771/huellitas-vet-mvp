services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_USER: vet_app
      DB_PASSWORD: PerritoSeguro123
      DB_CONNECT_STRING: oracle:1521/FREEPDB1
    depends_on:
      - oracle
    volumes:
      - ./frontend:/app/frontend:ro

  oracle:
    image: gvenzl/oracle-free:latest
    container_name: clinica-veterinaria-oracle-1
    environment:
      ORACLE_PASSWORD: AdminOracle123
      APP_USER: VET_APP
      APP_USER_PASSWORD: PerritoSeguro123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./DB/DB_Citas_Calendario.sql:/container-entrypoint-initdb.d/DB_Citas_Calendario.sql

volumes:
  oracle_data: