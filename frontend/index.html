<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria Huellitas - Calendario de Citas</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Cargar app.js para la vista de calendario y vista_citas.js para el formulario -->
    <script src="js/app.js" defer></script>
    <script src="js/vista_citas.js" defer></script>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🐾 Veterinaria Huellitas</h1>
            <p class="subtitle">Sistema de Citas y Calendario</p>
        </header>

        <main class="calendar-card">
            <!-- Encabezado con botones e IDs requeridos por app.js -->
            <div class="calendar-header">
                <button id="btnPrev" class="nav-btn" aria-label="Mes anterior">&larr;</button>
                <h2 id="monthYearText">Septiembre de 2026</h2>
                <button id="btnNext" class="nav-btn" aria-label="Mes siguiente">&rarr;</button>
            </div>

            <!-- Días de la semana -->
            <div class="weekdays-grid">
                <div>Dom</div>
                <div>Lun</div>
                <div>Mar</div>
                <div>Mié</div>
                <div>Jue</div>
                <div>Vie</div>
                <div>Sáb</div>
            </div>

            <!-- Contenedor donde app.js dibuja los días -->
            <div id="daysGrid" class="days-grid"></div>

            <!-- Sección de detalle de citas -->
            <section class="details-section">
                <h3 id="selectedDateTitle">Citas para hoy</h3>
                <div id="citasList" class="citas-list">
                    <p class="empty-msg">Cargando citas...</p>
                </div>
            </section>
        </main>
    </div>

    <div id="seccion-agendar">
        <h2>Agendar Nueva Cita</h2>
        <form id="form-cita">
            <label for="nombre_dueno">Nombre del dueño:</label>
            <input type="text" id="nombre_dueno" required>
            
            <label for="nombre_mascota">Nombre de la mascota:</label>
            <input type="text" id="nombre_mascota" required>
            
            <label for="fecha_hora">Fecha y Hora:</label>
            <input type="datetime-local" id="fecha_hora" required>
            
            <button type="submit">Agendar Cita</button>
        </form>
        
        <!-- Aquí se mostrarán los mensajes de éxito o error -->
        <div id="mensaje-resultado"></div>
    </div>
</body>

</html>
